<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>I piatti della tradizione piacentina – Realtà Aumentata</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  #ar { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; }

  /* ---------- schermata iniziale ---------- */
  #start {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 35%, #7a2a1c 0%, #3a120c 55%, #150604 100%);
  }
  #start h1 { font-family: Georgia, "Times New Roman", serif; font-size: 27px; line-height: 1.25; max-width: 340px; margin: 0 0 6px; letter-spacing: 1px; color: #ffd98a; }
  #start p { font-size: 16px; line-height: 1.45; max-width: 320px; margin: 10px 0 26px; opacity: .9; }
  #startBtn {
    appearance: none; -webkit-appearance: none; border: 2px solid #fff; background: #fff; color: #5a1a10;
    font-size: 17px; font-weight: 700; letter-spacing: .5px; padding: 15px 30px; border-radius: 40px;
  }
  #startBtn:active { transform: scale(.97); }
  #start.boot #startBtn { display: none; }
  #mute {
    position: fixed; z-index: 22; left: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px);
    appearance: none; -webkit-appearance: none; border: none; background: rgba(0,0,0,.55);
    font-size: 18px; width: 40px; height: 40px; border-radius: 50%; display: none;
  }
  #mute.on { display: block; }
  #msg { margin-top: 18px; font-size: 14px; min-height: 20px; color: #ffd0c0; max-width: 320px; }

  /* ---------- mirino di scansione ---------- */
  #scan {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    display: none; align-items: center; justify-content: center; flex-direction: column;
  }
  #scan.on { display: flex; }
  #frame {
    position: relative;
    width: min(64vw, 37vh);          /* proporzione della pagina (circa 0,58) */
    aspect-ratio: 361 / 622;
    box-shadow: 0 0 0 200vmax rgba(0,0,0,.38);
    border-radius: 6px;
  }
  #frame i {
    position: absolute; width: 44px; height: 44px; border: 5px solid #fff;
    filter: drop-shadow(0 0 4px rgba(0,0,0,.6));
    animation: pulse 1.6s ease-in-out infinite;
  }
  #frame i:nth-child(1) { top: -3px; left: -3px;  border-right: none; border-bottom: none; border-top-left-radius: 10px; }
  #frame i:nth-child(2) { top: -3px; right: -3px; border-left: none;  border-bottom: none; border-top-right-radius: 10px; }
  #frame i:nth-child(3) { bottom: -3px; left: -3px;  border-right: none; border-top: none; border-bottom-left-radius: 10px; }
  #frame i:nth-child(4) { bottom: -3px; right: -3px; border-left: none;  border-top: none; border-bottom-right-radius: 10px; }
  #line {
    position: absolute; left: 6%; right: 6%; height: 3px; top: 0; border-radius: 3px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    box-shadow: 0 0 12px 2px rgba(255,255,255,.8);
    animation: sweep 2.4s ease-in-out infinite;
  }
  #scanTxt {
    position: relative; margin-top: 26px; font-size: 16px; font-weight: 600;
    background: rgba(0,0,0,.55); padding: 9px 18px; border-radius: 22px;
  }
  @keyframes sweep { 0%,100% { top: 3%; } 50% { top: 96%; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* ---------- suggerimenti / pulsanti ---------- */
  #hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); z-index: 21; pointer-events: none;
    font-size: 15px; font-weight: 600; background: rgba(0,0,0,.6); padding: 10px 18px; border-radius: 22px;
    opacity: 0; transition: opacity .4s; white-space: nowrap;
  }
  #hint.on { opacity: 1; }
  #replay {
    position: fixed; z-index: 22; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px);
    appearance: none; -webkit-appearance: none; border: none; color: #fff; background: rgba(0,0,0,.55);
    font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 20px; display: none;
  }
  #replay.on { display: block; }

  /* ---------- flipbook dentro la pagina ---------- */
  #book { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; background: #150604; }
  #book.on { display: flex; }
  #bookBar {
    flex: 0 0 auto; display: flex; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
  }
  #back {
    appearance: none; -webkit-appearance: none; border: none; background: #fff; color: #5a1a10;
    font-size: 15px; font-weight: 700; padding: 11px 20px; border-radius: 26px;
  }
  #back:active { transform: scale(.97); }
  #bookFrame { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }
</style>

<!-- compatibilità importmap per iOS/Android meno recenti -->
<script async src="https://unpkg.com/es-module-shims@1.8.3/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",

  }
}
</script>

<body>
<div id="ar"></div>

<div id="start" class="boot">
  <h1>I PIATTI DELLA TRADIZIONE PIACENTINA</h1>
  <p id="startTxt">Avvio della fotocamera…</p>
  <button id="startBtn">AVVIA L'ESPERIENZA</button>
  <div id="msg"></div>
</div>

<audio id="music" src="./musica.mp3" preload="auto" playsinline></audio>
<button id="mute" aria-label="Audio">🔊</button>

<div id="scan">
  <div id="frame"><i></i><i></i><i></i><i></i><div id="line"></div></div>
  <div id="scanTxt">Inquadra la pagina</div>
</div>

<div id="hint">👆 Tocca la scritta per sfogliare</div>
<button id="replay">↻ Rivedi</button>

<div id="book">
  <div id="bookBar"><button id="back">← Torna alla realtà aumentata</button></div>
  <iframe id="bookFrame" title="Flipbook" allow="fullscreen" allowfullscreen></iframe>
</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

/* =====================  IMPOSTAZIONI  ===================== */
const TARGET_FILE = './targets.mind';                                   // stesso livello di index.html
const LINK_URL    = './pisarei.html';      // flipbook dei pisarei (tutti nella stessa cartella di index.html)
const LINK_2      = './tortelli.html';     // flipbook dei tortelli
const INTRO_IMG   = './pisarei_trasparente.png';   // foto che appare in AR appena si aggancia la pagina
/* musica: file audio nella stessa cartella. Se è il brano intero ne viene suonato solo il pezzo FROM-TO (secondi) */
const MUSIC_FROM = 36, MUSIC_TO = 52, MUSIC_LOOP = true;
const TITLE_TEXT  = 'PISAREI E FASÖ';
const TITLE_2    = 'TURTÈI';
const TITLE_3    = 'ANVEIN';
const TITLE_4    = "PICULA 'D CAVAL";
const LINK_3     = './anolini.html';      // flipbook degli anolini
const LINK_4     = './picula.html';       // flipbook della picula
/* secondo in cui parte ogni piatto */
const T2 = 19.5, T3 = 36.5, T4 = 52.5, T_END = 67;

/* =====================  UTILITÀ  ===================== */
const $ = id => document.getElementById(id);
const clamp = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeBack = k => { const c = 1.70158; const x = k - 1; return 1 + (c + 1) * x * x * x + c * x * x; };
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);

/* =====================  AVVIO  ===================== */
/* fasi: boot (fotocamera) -> scan (mirino) -> intro (foto in AR da toccare) -> ready (pulsante) -> play (animazione) */
const startBtn = $('startBtn'), msg = $('msg'), startBox = $('start'), startTxt = $('startTxt');
let state = 'boot', onStart = null;

function showStart(mode) {
  startBox.className = mode || '';
  startBox.style.display = mode ? 'flex' : 'none';
  if (mode === 'boot')  { startTxt.textContent = 'Avvio della fotocamera…'; msg.textContent = ''; }
  if (mode === 'error') { startTxt.textContent = 'Per vedere i piatti serve la fotocamera.'; startBtn.textContent = 'ATTIVA LA FOTOCAMERA';
                          msg.textContent = 'Consenti l\'accesso e apri la pagina in Safari (iPhone) o Chrome (Android).'; }
  if (mode === 'ready') { startTxt.textContent = 'Tieni inquadrata la pagina e alza il volume: i quattro piatti nascono davanti a te.';
                          startBtn.textContent = 'AVVIA L\'ESPERIENZA'; msg.textContent = ''; }
}

async function boot() {
  state = 'boot'; showStart('boot');
  try {
    await run();
    state = 'scan'; showStart(null);
    $('scan').classList.add('on');
  } catch (e) {
    console.error(e);
    $('ar').innerHTML = '';
    state = 'error'; showStart('error');
  }
}
startBtn.addEventListener('click', () => {
  if (state === 'error') boot();
  else if (state === 'ready' && onStart) onStart();
});

/* =====================  MUSICA  ===================== */
const music = $('music'), muteBtn = $('mute');
let musicOK = true, muted = false, musicDone = false;
music.addEventListener('error', () => { musicOK = false; muteBtn.classList.remove('on'); });   // file assente: si prosegue in silenzio
const cutOK = () => MUSIC_TO > 0 && music.duration && music.duration > MUSIC_TO - 0.5;         // il file è il brano intero?
const mFrom = () => cutOK() ? MUSIC_FROM : 0;
const mTo   = () => cutOK() ? MUSIC_TO : Infinity;
function musicRestart() { musicDone = false; try { music.currentTime = mFrom(); } catch (e) {} }
music.addEventListener('loadedmetadata', () => { if (music.currentTime < mFrom()) musicRestart(); });
music.addEventListener('ended', () => { if (MUSIC_LOOP) { musicRestart(); music.play().catch(() => {}); } else musicDone = true; });
function musicSync(want) {
  if (!musicOK) return;
  if (!music.paused && music.currentTime >= mTo()) {
    if (MUSIC_LOOP) music.currentTime = mFrom(); else { musicDone = true; music.pause(); }
  }
  want = want && !muted && !musicDone;
  if (want && music.paused) music.play().catch(() => {});
  else if (!want && !music.paused) music.pause();
}
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; });

/* =====================  FOTO INIZIALE IN AR  ===================== */
function buildIntro(root) {
  const g = new THREE.Group(); g.position.set(0, 0, 0.12); g.visible = false; root.add(g);
  const W = 0.95;
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, opacity: 0 }));
  g.add(photo);

  const tapTex = canvasTex(256, 256, (c, w) => {            // simbolo "tocca qui"
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.beginPath(); c.arc(w / 2, w / 2, 104, 0, 6.2832); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 10; c.stroke();
    c.font = '130px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('👆', w / 2, w / 2 + 8);
  });
  const ringTex = canvasTex(256, 256, (c, w) => {
    c.strokeStyle = '#fff'; c.lineWidth = 12; c.beginPath(); c.arc(w / 2, w / 2, 112, 0, 6.2832); c.stroke();
  });
  const basic = tex => new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false });
  const ring = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.26), basic(ringTex));
  const tap = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.26), basic(tapTex));
  ring.renderOrder = 20; tap.renderOrder = 21;
  const tg = new THREE.Group(); tg.position.set(0.25, -0.2, 0.06); tg.add(ring, tap); g.add(tg);

  new THREE.TextureLoader().load(INTRO_IMG, tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    const a = tex.image.height / tex.image.width;
    photo.material.map = tex; photo.material.opacity = 1; photo.material.needsUpdate = true;
    photo.scale.set(W, W * a, 1);
    tg.position.set(W * 0.5 - 0.17, -W * a * 0.5 + 0.12, 0.06);       // in basso a destra sulla foto
  }, undefined, () => { tg.position.set(0, 0, 0.06); });                // foto assente: resta solo il simbolo

  function update(clock) {
    g.position.y = 0.015 * Math.sin(clock * 1.6);
    tap.scale.setScalar(1 + 0.08 * Math.sin(clock * 5));
    const u = (clock * 0.8) % 1;
    ring.scale.setScalar(1 + u * 0.9); ring.material.opacity = 1 - u;
  }
  return { group: g, update };
}

async function run() {
  const mindar = new MindARThree({
    container: $('ar'),
    imageTargetSrc: TARGET_FILE,
    uiScanning: 'no', uiLoading: 'no', uiError: 'no',
    filterMinCF: 0.0005, filterBeta: 0.005,       // movimento più stabile
    warmupTolerance: 3, missTolerance: 10
  });
  const { renderer, scene, camera } = mindar;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b5340, 1.9));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(0.4, 1, 1.2);
  scene.add(sun);

  const anchor = mindar.addAnchor(0);
  const g = anchor.group;
  const scenes = [
    { s: buildWorld(g, 0),    t0: 0,  url: LINK_URL },
    { s: buildTortelli(g, 1), t0: T2, url: LINK_2 },
    { s: buildAnolini(g, 2),  t0: T3, url: LINK_3 },
    { s: buildPicula(g, 3),   t0: T4, url: LINK_4 }
  ];
  const world = {
    update(t, c) {
      for (const sc of scenes) {
        const lt = t - sc.t0;
        if (lt > sc.s.dur) {                       // piatto finito: resta fermo, si anima solo la scritta
          if (!sc.done) { sc.s.update(lt, c); sc.done = true; }
          sc.s.title.update(lt, sc.s.tTitle, c);
          if (sc.s.idle) sc.s.idle(c);
        } else { sc.done = false; sc.s.update(lt, c); }
      }
    },
    titleReady: () => scenes.some(sc => sc.url && sc.s.title.ready()),
    links: scenes.filter(sc => sc.url).map(sc => [sc.s.title, sc.url])
  };

  const intro = buildIntro(g);

  let visible = false;
  anchor.onTargetFound = () => { visible = true;  $('scan').classList.remove('on'); if (state === 'scan') state = 'intro'; };
  anchor.onTargetLost  = () => { visible = false; $('scan').classList.add('on'); $('hint').classList.remove('on'); };

  /* ---- tocco sulla scritta ---- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  $('ar').addEventListener('click', ev => {
    if (state === 'intro' && visible) { state = 'ready'; showStart('ready'); return; }   // tocco sulla foto iniziale
    if (state !== 'play' || !visible || !world.titleReady()) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
    ndc.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    for (const [ti, url] of world.links) {
      if (ti.ready() && ray.intersectObject(ti.hit, false).length) { openBook(url); break; }
    }
  });

  /* ---- flipbook: si apre sopra la realtà aumentata, la fotocamera resta attiva sotto ---- */
  let bookOpen = false;
  function openBook(url) {
    bookOpen = true;
    $('bookFrame').src = url;
    $('book').classList.add('on');
  }
  $('back').addEventListener('click', () => {
    bookOpen = false;
    $('book').classList.remove('on');
    $('bookFrame').src = 'about:blank';
    last = performance.now();
  });

  $('replay').addEventListener('click', () => { time = 0; musicRestart(); });

  onStart = () => {                       // pulsante AVVIA L'ESPERIENZA: partono pisarei e musica
    state = 'play'; showStart(null);
    time = 0; last = performance.now();
    if (musicOK) { muteBtn.classList.add('on'); musicRestart(); music.play().catch(() => {}); }
  };

  await mindar.start();

  let time = 0, last = performance.now();
  renderer.setAnimationLoop(() => {
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (bookOpen) { musicSync(false); return; }      // in pausa mentre si sfoglia
    intro.group.visible = state === 'intro';
    if (state === 'intro') intro.update(now / 1000);
    musicSync(state === 'play' && visible && time < T_END + 2);
    if (state !== 'play') { renderer.render(scene, camera); return; }
    if (visible) {
      time += dt;                         // l'animazione avanza solo con la pagina inquadrata
      world.update(time, now / 1000);
      $('hint').classList.toggle('on', world.titleReady());
      $('replay').classList.toggle('on', time > T_END);
    } else {
      $('replay').classList.remove('on');
    }
    renderer.render(scene, camera);
  });

  document.addEventListener('visibilitychange', () => { last = performance.now(); });
}

/* =====================  TEXTURE GENERATE (nessun file esterno)  ===================== */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function beanTexture() {            // borlotti: fondo bordeaux con screziature color nocciola
  return canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = '#7b2632'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) {
      g.strokeStyle = ['#d8a56a', '#c98a55', '#e3b98a', '#5a1722'][i % 4];
      g.globalAlpha = rnd(0.5, 0.95);
      g.lineWidth = rnd(1.5, 5);
      g.beginPath();
      const x = rnd(0, w), y = rnd(0, h);
      g.moveTo(x, y);
      g.quadraticCurveTo(x + rnd(-14, 14), y + rnd(-10, 10), x + rnd(-26, 26), y + rnd(-8, 8));
      g.stroke();
    }
  });
}

function glowTexture() {
  return canvasTex(256, 256, (g, w) => {
    const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    r.addColorStop(0, 'rgba(255,250,225,1)');
    r.addColorStop(0.35, 'rgba(255,215,130,0.55)');
    r.addColorStop(1, 'rgba(255,180,60,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, w);
  });
}

function raysTexture() {
  return canvasTex(512, 512, (g, w) => {
    g.translate(w / 2, w / 2);
    const r = g.createRadialGradient(0, 0, 10, 0, 0, w / 2);
    r.addColorStop(0, 'rgba(255,240,190,0.9)');
    r.addColorStop(1, 'rgba(255,220,140,0)');
    g.fillStyle = r;
    const n = 18;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, s = (i % 2 ? 0.05 : 0.09);
      g.beginPath(); g.moveTo(0, 0);
      g.lineTo(Math.cos(a - s) * w, Math.sin(a - s) * w);
      g.lineTo(Math.cos(a + s) * w, Math.sin(a + s) * w);
      g.closePath(); g.fill();
    }
  });
}

function softTexture() {
  return canvasTex(128, 128, (g, w) => {
    const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    r.addColorStop(0, 'rgba(255,255,255,0.9)');
    r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, w);
  });
}

function titleTexture(text) {
  return canvasTex(1024, 256, (g, w, h) => {
    let size = 150;
    const font = s => `900 ${s}px Georgia, "Times New Roman", serif`;
    g.font = font(size);
    const mw = g.measureText(text).width;
    if (mw > w * 0.9) size = Math.floor(size * (w * 0.9) / mw);
    g.font = font(size);
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    const x = w / 2, y = h / 2 + 4;
    g.shadowColor = 'rgba(255,200,90,0.95)'; g.shadowBlur = 34;       // alone luminoso
    g.strokeStyle = '#5a1509'; g.lineWidth = 14; g.strokeText(text, x, y);
    g.shadowBlur = 0;
    g.strokeStyle = '#5a1509'; g.lineWidth = 10; g.strokeText(text, x, y);
    const gr = g.createLinearGradient(0, y - size / 2, 0, y + size / 2);
    gr.addColorStop(0, '#fffbe6'); gr.addColorStop(0.5, '#ffd766'); gr.addColorStop(1, '#f29a1f');
    g.fillStyle = gr; g.fillText(text, x, y);
  }, false);
}

/* =====================  ELEMENTI CONDIVISI  ===================== */
const dummy = new THREE.Object3D();
function put(mesh, i, x, y, z, s = 1, rx = 0, ry = 0, rz = 0) {
  dummy.position.set(x, y, z); dummy.rotation.set(rx, ry, rz); dummy.scale.setScalar(s);
  dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
}
function mkInst(parent, geo, mat, n) {
  const m = new THREE.InstancedMesh(geo, mat, n);
  m.frustumCulled = false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  parent.add(m); return m;
}

/* scritta luminosa cliccabile, sempre rivolta verso chi guarda */
let glowTex = null, raysTex = null;
function makeTitle(root, text, x, y, z) {
  if (!glowTex) { glowTex = glowTexture(); raysTex = raysTexture(); }
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.scale.setScalar(0.44);
  g.visible = false;
  root.add(g);
  const addMat = tex => new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false });
  const rays = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 1.25), addMat(raysTex));
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.62), addMat(glowTex));
  const txtMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, depthTest: false,
    uniforms: { map: { value: titleTexture(text) }, time: { value: 0 }, opacity: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `
      precision mediump float;
      uniform sampler2D map; uniform float time; uniform float opacity; varying vec2 vUv;
      void main(){
        vec4 t = texture2D(map, vUv);
        float p = mod(time * 0.55, 2.2) - 0.5;                       // fascio di luce che scorre
        float band = smoothstep(0.13, 0.0, abs(vUv.x + (vUv.y - 0.5) * 0.35 - p));
        vec3 c = t.rgb + band * vec3(1.0, 0.96, 0.8) * 0.85 * t.a;
        gl_FragColor = vec4(c, t.a * opacity);
      }`
  });
  const txt = new THREE.Mesh(new THREE.PlaneGeometry(0.98, 0.245), txtMat);
  const hit = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.42), new THREE.MeshBasicMaterial({ visible: false }));
  rays.renderOrder = 10; glow.renderOrder = 11; txt.renderOrder = 12;
  g.add(rays, glow, txt, hit);
  let on = false;

  function update(t, t0, clock) {
    const tp = seg(t, t0, t0 + 0.9);
    on = tp > 0.6;
    g.visible = tp > 0;
    if (!g.visible) return;
    const s = Math.max(0.001, easeBack(tp));
    txt.scale.setScalar(s);
    txtMat.uniforms.time.value = clock;
    txtMat.uniforms.opacity.value = clamp(tp * 2);
    const burst = 1 - easeOut(seg(t, t0, t0 + 1.6));                 // lampo iniziale
    glow.scale.setScalar(s * (1 + burst * 1.6 + 0.06 * Math.sin(clock * 3)));
    glow.material.opacity = clamp(tp * 2) * (0.55 + 0.45 * burst + 0.12 * Math.sin(clock * 3));
    rays.scale.setScalar(s * (1 + burst * 0.8));
    rays.rotation.z = clock * 0.25;
    rays.material.opacity = clamp(tp * 2) * (0.28 + 0.5 * burst);
  }
  return { hit, update, ready: () => on };
}

/* =====================  SCENA 2: TORTELLI CON LA CODA  ===================== */
function fillingTexture() {         // ricotta con pezzetti di spinaci
  return canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#e4ebcf'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 140; i++) {
      g.fillStyle = ['#2c6b2f', '#3f8a3a', '#1f5224', '#f3e2a0'][i % 4];
      g.globalAlpha = rnd(0.6, 1);
      g.fillRect(rnd(0, w), rnd(0, h), rnd(2, 7), rnd(1.5, 4));
    }
  });
}

function tortelloTexture() {        // pasta all'uovo infarinata con venature verdi di ripieno
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#f0d458'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 500; i++) {
      g.fillStyle = i % 3 ? '#fbeaa0' : '#e2bd3c';
      g.globalAlpha = rnd(0.25, 0.7);
      g.fillRect(rnd(0, w), rnd(0, h), rnd(1, 4), rnd(1, 4));
    }
    g.globalAlpha = 0.85; g.lineCap = 'round';
    for (const y of [0.36, 0.5, 0.63]) {                 // la v della texture corre lungo il tortello
      g.strokeStyle = '#6fae3c'; g.lineWidth = rnd(4, 7);
      g.beginPath(); g.moveTo(w * 0.05, h * y); g.lineTo(w * 0.45, h * (y + 0.05)); g.stroke();
    }
  });
}

function tortelloGeometry() {       // corpo intrecciato e panciuto, con le due "code" a nastro
  const pts = [], n = 40, L = 0.125, R = 0.042;
  const sm = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
  for (let i = 0; i <= n; i++) {
    const u = -1 + 2 * i / n;
    pts.push(new THREE.Vector2(R * (0.3 + 0.7 * Math.pow(1 - u * u, 1.4)), u * L));
  }
  const g = new THREE.LatheGeometry(pts, 28);
  g.rotateZ(Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i); let y = p.getY(i), z = p.getZ(i);
    const u = x / L, au = Math.abs(u), r = Math.hypot(y, z);
    const tail = sm(0.5, 0.95, au);
    if (y > 0) {                                           // treccia: pieghe a spina di pesce
      const s = Math.sin(u * 17 - (Math.abs(z) / R) * 3.0);
      y += 0.5 * r * Math.sign(s) * Math.pow(Math.abs(s), 0.6) * (1 - tail);
    }
    y *= (y > 0 ? lerp(0.8, 0.1, tail) : lerp(0.4, 0.1, tail));   // code schiacciate
    z *= 1 + 0.9 * tail;                                   // ...e allargate a nastro
    const tw = Math.sign(u) * tail * 0.8;                  // leggera torsione della coda
    const c = Math.cos(tw), sn = Math.sin(tw);
    p.setXYZ(i, x, y * c - z * sn + tail * 0.006, y * sn + z * c);
  }
  g.computeVertexNormals();
  return g;
}

function buildTortelli(root, idx) {
  const T = {
    bowl: [0, 0.7], ricotta: 0.6, spin: 1.6, grana: 3.0, salt: 4.4, mix: [5.4, 7.6],
    board: [6.6, 7.4], dust: 7.2, dustOut: [8.9, 9.5], sheets: 8.4, scoop: 9.6,
    bowlOut: [11.6, 12.4], fold: 12.2, sage: [14.4, 15.0], title: 15.0
  };

  const stage = new THREE.Group();
  placeStage(stage, idx);
  stage.visible = false;
  root.add(stage);
  const V = (x, y) => new THREE.Vector2(x, y);

  /* ---- ciotola del ripieno ---- */
  const BOWL_Y = 0.50;
  const bowl = new THREE.Group(); bowl.position.y = BOWL_Y; stage.add(bowl);
  bowl.add(
    new THREE.Mesh(new THREE.LatheGeometry([V(0, 0), V(0.10, 0), V(0.12, 0.01), V(0.235, 0.125), V(0.24, 0.135)], 48),
      new THREE.MeshStandardMaterial({ color: 0xb9b0a2, roughness: 0.4, side: THREE.DoubleSide })),
    new THREE.Mesh(new THREE.LatheGeometry([V(0.24, 0.135), V(0.232, 0.141), V(0.222, 0.135), V(0.11, 0.025), V(0, 0.025)], 48),
      new THREE.MeshStandardMaterial({ color: 0xece7dd, roughness: 0.45, side: THREE.DoubleSide })));

  const spots = (n, spread, rmax, y0, y1) => Array.from({ length: n }, () => ({
    r: rmax * Math.sqrt(Math.random()), a: rnd(0, 6.28), y: rnd(y0, y1), h: rnd(0.5, 0.68), d: rnd(0, spread),
    rx: rnd(-0.4, 0.4), ry: rnd(0, 6.28), rz: rnd(-0.4, 0.4), sp: rnd(3, 7) }));

  /* ricotta */
  const ricotta = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.085, 0.08, 28),
    new THREE.MeshStandardMaterial({ color: 0xfbfaf5, roughness: 1 }));
  bowl.add(ricotta);

  /* spinaci */
  const NSP = 14;
  const spGeo = new THREE.IcosahedronGeometry(0.036, 1); spGeo.scale(1, 0.3, 0.75);
  const spin = mkInst(bowl, spGeo, new THREE.MeshStandardMaterial({ color: 0x1e5a24, roughness: 0.55 }), NSP);
  const spA = spots(NSP, 1.0, 0.12, 0.07, 0.12);

  /* grana padano grattugiato */
  const NG = 60;
  const grana = mkInst(bowl, new THREE.BoxGeometry(0.034, 0.003, 0.009),
    new THREE.MeshStandardMaterial({ color: 0xf2d98c, roughness: 0.7 }), NG);
  const grA = spots(NG, 1.1, 0.13, 0.09, 0.14);

  /* sale */
  const NSA = 40;
  const salt = mkInst(bowl, new THREE.IcosahedronGeometry(0.0045, 0),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }), NSA);
  const saA = spots(NSA, 0.6, 0.08, 0.10, 0.14);

  /* ripieno mescolato */
  const fillMat = new THREE.MeshStandardMaterial({ map: fillingTexture(), roughness: 0.9 });
  const filling = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 14), fillMat);
  filling.position.y = 0.07; bowl.add(filling);

  /* ---- tagliere ---- */
  const TOP = 0.012;
  const board = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.024, 44),
    new THREE.MeshStandardMaterial({ color: 0xb98a55, roughness: 0.8 }));
  stage.add(board);

  /* spolverata di farina */
  const ND = 90;
  const dust = mkInst(stage, new THREE.IcosahedronGeometry(0.008, 0),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }), ND);
  const duA = Array.from({ length: ND }, () => ({ r: 0.3 * Math.sqrt(Math.random()), a: rnd(0, 6.28), d: rnd(0, 1.0), h: rnd(0.75, 0.95), s: rnd(0.6, 1.3) }));

  /* sfoglie, ripieno e tortelli */
  const N = 8;
  const slots = Array.from({ length: N }, (_, i) => ({
    x: ((i % 4) - 1.5) * 0.105 + rnd(-0.008, 0.008), z: (i < 4 ? -0.12 : 0.12) + rnd(-0.01, 0.01),
    ry: Math.PI / 2 + rnd(-0.3, 0.3) }));
  const pastaMat = new THREE.MeshStandardMaterial({ color: 0xf2d55e, roughness: 0.6, side: THREE.DoubleSide });
  const sheets = mkInst(stage, new THREE.BoxGeometry(0.075, 0.004, 0.075), pastaMat, N);
  const dollGeo = new THREE.SphereGeometry(0.027, 12, 10); dollGeo.scale(1, 0.7, 1);
  const dolls = mkInst(stage, dollGeo, fillMat, N);
  const tortMat = new THREE.MeshStandardMaterial({ map: tortelloTexture(), roughness: 0.6, side: THREE.DoubleSide });
  const torts = mkInst(stage, tortelloGeometry(), tortMat, N);

  /* foglie di salvia */
  const sageGeo = new THREE.SphereGeometry(1, 12, 8); sageGeo.scale(0.055, 0.004, 0.02);
  const sage = mkInst(stage, sageGeo, new THREE.MeshStandardMaterial({ color: 0x7f9a6e, roughness: 0.8 }), 3);
  const sgA = [[-0.03, 0.02, 0.5], [0.07, -0.05, -0.6], [-0.1, 0.1, 2.2]];

  const title = makeTitle(root, TITLE_2, ...titlePos(idx));

  function fall(mesh, arr, t, start, m) {
    mesh.visible = t > start && m < 1;
    if (!mesh.visible) return;
    for (let i = 0; i < arr.length; i++) {
      const q = arr[i];
      if (t < start + q.d) { put(mesh, i, 0, 0, 0, 0); continue; }
      const p = clamp((t - start - q.d) / 0.7);
      const ang = q.a + m * m * 9, rad = q.r * (1 - 0.7 * m), sp = (1 - p) * q.sp;
      put(mesh, i, Math.cos(ang) * rad, lerp(q.h, q.y, p * p), Math.sin(ang) * rad, 1 - m, q.rx + sp, q.ry, q.rz + sp);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }

  function update(t, clock) {
    stage.visible = t >= 0;
    title.update(t, T.title, clock);
    if (t < 0) return;

    /* ciotola e ingredienti */
    const bs = easeBack(seg(t, ...T.bowl)) * (1 - ease(seg(t, ...T.bowlOut)));
    bowl.visible = bs > 0.005; bowl.scale.setScalar(Math.max(0.001, bs));
    const m = seg(t, ...T.mix);

    const rp = clamp((t - T.ricotta) / 0.7), rs = 1 - ease(m);
    ricotta.visible = t > T.ricotta && rs > 0.01;
    ricotta.position.y = lerp(0.6, 0.065, rp * rp);
    ricotta.scale.set(rs * (1 + m), Math.max(0.001, rs), rs * (1 + m));

    fall(spin, spA, t, T.spin, m);
    fall(grana, grA, t, T.grana, m);
    fall(salt, saA, t, T.salt, m);

    const used = seg(t, T.scoop, T.scoop + N * 0.22 + 0.4);
    const fs = ease(m) * (1 - 0.8 * used);
    filling.visible = fs > 0.01;
    filling.scale.set(0.15 * fs, 0.05 * fs, 0.15 * fs);
    filling.rotation.y = m < 1 ? t * 2.5 : 0;

    /* tagliere e farina */
    board.visible = t > T.board[0];
    board.scale.setScalar(Math.max(0.001, easeBack(seg(t, ...T.board))));
    const dOut = seg(t, ...T.dustOut);
    dust.visible = t > T.dust && dOut < 1;
    if (dust.visible) {
      for (let i = 0; i < ND; i++) {
        const q = duA[i];
        if (t < T.dust + q.d) { put(dust, i, 0, 0, 0, 0); continue; }
        const p = clamp((t - T.dust - q.d) / 0.7);
        put(dust, i, Math.cos(q.a) * q.r, lerp(q.h, TOP + 0.004, p * p), Math.sin(q.a) * q.r, q.s * (1 - dOut));
      }
      dust.instanceMatrix.needsUpdate = true;
    }

    /* sfoglia -> ripieno -> tortello */
    sheets.visible = dolls.visible = torts.visible = t > T.sheets;
    if (sheets.visible) {
      for (let i = 0; i < N; i++) {
        const s = slots[i];
        const a = easeBack(clamp((t - T.sheets - i * 0.12) / 0.5));
        const f = clamp((t - T.fold - i * 0.2) / 0.6);
        put(sheets, i, s.x, TOP + 0.004, s.z, Math.max(0, a) * (1 - f), 0, s.ry + Math.PI / 4 + f * 3, 0);

        const st = T.scoop + i * 0.22, p = clamp((t - st) / 0.7), k = ease(p);
        put(dolls, i, lerp(0, s.x, k), lerp(BOWL_Y + 0.09, TOP + 0.022, k) + Math.sin(Math.PI * p) * 0.14, lerp(0, s.z, k),
            t < st ? 0 : (1 - f));

        put(torts, i, s.x, TOP + 0.016 + Math.sin(Math.PI * f) * 0.05, s.z, f > 0 ? easeBack(f) : 0, 0, s.ry, 0);
      }
      sheets.instanceMatrix.needsUpdate = dolls.instanceMatrix.needsUpdate = torts.instanceMatrix.needsUpdate = true;
    }

    /* salvia e burro */
    const sg = seg(t, ...T.sage);
    sage.visible = sg > 0;
    if (sage.visible) {
      for (let i = 0; i < 3; i++) {
        const k = easeBack(clamp(sg * 1.6 - i * 0.3));
        put(sage, i, sgA[i][0], TOP + 0.05 + i * 0.004, sgA[i][1], Math.max(0, k), 0.15, sgA[i][2], 0.1);
      }
      sage.instanceMatrix.needsUpdate = true;
    }
    tortMat.roughness = lerp(0.6, 0.35, sg);
  }

  update(-1, 0);
  return { update, title, tTitle: T.title, dur: T.title + 2 };
}

/* =====================  DISPOSIZIONE DEI 4 PIATTI  ===================== */
const SC = 0.6;                                   // dimensione di ogni scena
const SPOT = [[-0.27, 0.28], [0.27, 0.28], [-0.27, -0.52], [0.27, -0.52]];   // 2 colonne x 2 righe sulla pagina
function placeStage(stage, i) {
  stage.position.set(SPOT[i][0], SPOT[i][1], 0.06);
  stage.rotation.x = 0.78;                        // inclinazione verso chi guarda
  stage.scale.setScalar(SC);
}
const titlePos = i => [SPOT[i][0], SPOT[i][1] + 0.25, 0.20];

let softTex = null;
function makeSteam(stage, n, y0, spread) {
  if (!softTex) softTex = softTexture();
  const arr = Array.from({ length: n }, (_, i) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, transparent: true, opacity: 0, depthWrite: false }));
    s.userData = { ph: i / n, x: rnd(-spread, spread) }; stage.add(s); return s;
  });
  return (so, clock) => {
    for (const s of arr) {
      const u = (clock * 0.28 + s.userData.ph) % 1;
      s.visible = so > 0;
      s.position.set(s.userData.x + Math.sin(u * 6 + s.userData.ph * 9) * 0.03, y0 + u * 0.35, 0);
      s.scale.setScalar(0.1 + u * 0.14);
      s.material.opacity = so * 0.32 * Math.sin(Math.PI * u);
    }
  };
}

const V2 = (x, y) => new THREE.Vector2(x, y);
const std = (color, roughness = 0.7, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness }, extra));
function mkSpots(n, spread, rmax, y0, y1) {
  return Array.from({ length: n }, () => ({
    r: rmax * Math.sqrt(Math.random()), a: rnd(0, 6.28), y: rnd(y0, y1), h: rnd(0.5, 0.68), d: rnd(0, spread),
    rx: rnd(-0.4, 0.4), ry: rnd(0, 6.28), rz: rnd(-0.4, 0.4), sp: rnd(3, 7) }));
}
/* ingredienti che cadono in una ciotola e poi si mescolano (m = 0..1) fino a sparire nell'impasto */
function fallMix(mesh, arr, t, start, m) {
  mesh.visible = t > start && m < 1;
  if (!mesh.visible) return;
  for (let i = 0; i < arr.length; i++) {
    const q = arr[i];
    if (t < start + q.d) { put(mesh, i, 0, 0, 0, 0); continue; }
    const p = clamp((t - start - q.d) / 0.7);
    const ang = q.a + m * m * 9, rad = q.r * (1 - 0.7 * m), sp = (1 - p) * q.sp;
    put(mesh, i, Math.cos(ang) * rad, lerp(q.h, q.y, p * p), Math.sin(ang) * rad, 1 - m, q.rx + sp, q.ry, q.rz + sp);
  }
  mesh.instanceMatrix.needsUpdate = true;
}
function makeBowl(stage, y) {
  const bowl = new THREE.Group(); bowl.position.y = y; stage.add(bowl);
  bowl.add(
    new THREE.Mesh(new THREE.LatheGeometry([V2(0, 0), V2(0.10, 0), V2(0.12, 0.01), V2(0.235, 0.125), V2(0.24, 0.135)], 40),
      std(0xb9b0a2, 0.4, { side: THREE.DoubleSide })),
    new THREE.Mesh(new THREE.LatheGeometry([V2(0.24, 0.135), V2(0.232, 0.141), V2(0.222, 0.135), V2(0.11, 0.025), V2(0, 0.025)], 40),
      std(0xece7dd, 0.45, { side: THREE.DoubleSide })));
  return bowl;
}

/* =====================  SCENA 3: ANVEIN (ANOLINI IN BRODO)  ===================== */
function anolinoGeometry() {        // dischetto con cupola di ripieno e bordo dentellato
  const g = new THREE.LatheGeometry([V2(0, 0.014), V2(0.01, 0.013), V2(0.018, 0.008), V2(0.024, 0.003), V2(0.037, 0.002)], 36);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    if (Math.hypot(x, z) > 0.03) {
      const k = 1 + 0.14 * Math.sin(Math.atan2(z, x) * 12);
      p.setX(i, x * k); p.setZ(i, z * k);
    }
  }
  g.computeVertexNormals();
  return g;
}

function buildAnolini(root, idx) {
  const T = {
    pot: [0, 0.7], meats: 0.7, broth: [2.4, 4.2], bowl: [3.8, 4.5], strac: 4.6, pane: 5.6, grana: 6.4, egg: 7.2,
    mix: [7.9, 9.7], fly: 9.9, bowlOut: [13.3, 14.1], title: 14.0
  };
  const stage = new THREE.Group(); placeStage(stage, idx); stage.visible = false; root.add(stage);

  /* zuppiera bianca */
  const pot = new THREE.Group(); stage.add(pot);
  pot.add(
    new THREE.Mesh(new THREE.LatheGeometry([V2(0, 0), V2(0.16, 0), V2(0.2, 0.015), V2(0.29, 0.15), V2(0.305, 0.17)], 48),
      std(0xf1eee7, 0.3, { side: THREE.DoubleSide })),
    new THREE.Mesh(new THREE.LatheGeometry([V2(0.305, 0.17), V2(0.296, 0.177), V2(0.284, 0.17), V2(0.19, 0.03), V2(0, 0.03)], 48),
      std(0xfbf9f4, 0.35, { side: THREE.DoubleSide })));

  /* le tre carni del brodo "di terza": manzo, cappone, traversino di vitello */
  const mg = [new THREE.IcosahedronGeometry(0.06, 1), new THREE.SphereGeometry(0.055, 14, 10), new THREE.IcosahedronGeometry(0.05, 1)];
  mg[0].scale(1.3, 0.7, 0.9); mg[1].scale(1.25, 0.8, 0.9); mg[2].scale(1.5, 0.6, 0.8);
  const meats = [[0x8e3b2e, -0.09, 0.02], [0xe9cda6, 0.08, -0.06], [0xd58f86, 0.02, 0.1]].map((c, i) => {
    const m = new THREE.Mesh(mg[i], std(c[0], 0.7)); m.position.set(c[1], 0, c[2]); m.rotation.y = i * 1.3; pot.add(m); return m;
  });

  /* brodo */
  const broth = new THREE.Mesh(new THREE.CircleGeometry(1, 48), std(0xe2b23c, 0.15, { transparent: true, opacity: 0.9 }));
  broth.rotation.x = -Math.PI / 2; pot.add(broth);
  const BROTH_Y = 0.135;

  /* ciotola del ripieno */
  const BOWL_Y = 0.50;
  const bowl = makeBowl(stage, BOWL_Y);
  const sg = new THREE.IcosahedronGeometry(0.022, 0); sg.scale(1.4, 0.6, 1);
  const strac = mkInst(bowl, sg, std(0x5a3220, 0.8), 22), stA = mkSpots(22, 0.8, 0.12, 0.05, 0.1);
  const pane = mkInst(bowl, new THREE.IcosahedronGeometry(0.006, 0), std(0xd9b377, 1), 70), paA = mkSpots(70, 0.7, 0.13, 0.08, 0.12);
  const grana = mkInst(bowl, new THREE.BoxGeometry(0.034, 0.003, 0.009), std(0xf2d98c, 0.7), 40), grA = mkSpots(40, 0.7, 0.13, 0.09, 0.13);
  const yolk = new THREE.Mesh(new THREE.SphereGeometry(0.036, 16, 12), std(0xf5a623, 0.35)); bowl.add(yolk);
  const filling = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 14), std(0x8c5c38, 0.9));
  filling.position.y = 0.07; bowl.add(filling);

  /* anolini */
  const N = 22;
  const ano = mkInst(stage, anolinoGeometry(), std(0xf0d266, 0.5, { side: THREE.DoubleSide }), N);
  const an = Array.from({ length: N }, (_, i) => {
    const r = 0.21 * Math.sqrt((i + 0.5) / N), a = i * 2.39996;
    return { x: Math.cos(a) * r, z: Math.sin(a) * r, rx: rnd(-0.25, 0.25), ry: rnd(0, 6.28), rz: rnd(-0.25, 0.25), ph: rnd(0, 6.28) };
  });

  const steam = makeSteam(stage, 5, 0.2, 0.12);
  const title = makeTitle(root, TITLE_3, ...titlePos(idx));

  function anolini(t, clock) {
    for (let i = 0; i < N; i++) {
      const q = an[i], st = T.fly + i * 0.13, p = clamp((t - st) / 0.75), k = ease(p);
      const y = lerp(BOWL_Y + 0.09, BROTH_Y + 0.004, k) + Math.sin(Math.PI * p) * 0.13 + (p >= 1 ? 0.003 * Math.sin(clock * 2 + q.ph) : 0);
      put(ano, i, lerp(0, q.x, k), y, lerp(0, q.z, k), t < st ? 0 : Math.min(1, p * 3), q.rx + (1 - p) * 5, q.ry, q.rz);
    }
    ano.instanceMatrix.needsUpdate = true;
  }

  function update(t, clock) {
    stage.visible = t >= 0;
    title.update(t, T.title, clock);
    if (t < 0) return;

    pot.scale.setScalar(Math.max(0.001, easeBack(seg(t, ...T.pot))));
    const bk = ease(seg(t, ...T.broth)), by = lerp(0.035, BROTH_Y, bk);
    broth.visible = t > T.broth[0];
    broth.position.y = by; broth.scale.setScalar(0.19 + (by - 0.03) * 0.671 - 0.004);
    const melt = 1 - ease(seg(t, T.broth[1] - 0.4, T.broth[1] + 0.8));       // le carni cedono il sapore al brodo
    meats.forEach((m, i) => {
      const st = T.meats + i * 0.5, p = clamp((t - st) / 0.6);
      m.visible = t > st && melt > 0.01;
      m.position.y = lerp(0.75, 0.075, p * p);
      m.scale.setScalar(Math.max(0.001, melt));
    });

    const bs = easeBack(seg(t, ...T.bowl)) * (1 - ease(seg(t, ...T.bowlOut)));
    bowl.visible = bs > 0.005; bowl.scale.setScalar(Math.max(0.001, bs));
    const m = seg(t, ...T.mix);
    fallMix(strac, stA, t, T.strac, m);
    fallMix(pane, paA, t, T.pane, m);
    fallMix(grana, grA, t, T.grana, m);
    const yp = clamp((t - T.egg) / 0.6);
    yolk.visible = t > T.egg && m < 1;
    yolk.position.y = lerp(0.6, 0.12, yp * yp);
    yolk.scale.set(1 + m, Math.max(0.001, (1 - m) * (yp >= 1 ? 0.7 : 1)), 1 + m);
    const fs = ease(m) * (1 - 0.85 * seg(t, T.fly, T.fly + N * 0.13));
    filling.visible = fs > 0.01;
    filling.scale.set(0.15 * fs, 0.05 * fs, 0.15 * fs);

    ano.visible = t > T.fly;
    if (ano.visible) anolini(t, clock);
    steam(seg(t, T.title - 1, T.title), clock);
  }

  update(-1, 0);
  return { update, title, tTitle: T.title, dur: T.title + 2, idle: c => { anolini(99, c); steam(1, c); } };
}

/* =====================  SCENA 4: PICULA 'D CAVAL  ===================== */
function buildPicula(root, idx) {
  const T = {
    pan: [0, 0.7], lardo: 0.7, cip: 1.6, car: 2.5, pep: 3.4, meat: 4.3, mix: [5.8, 8.2],
    plate: [7.6, 8.4], pour: 8.8, panOut: [11.6, 12.4], title: 12.3
  };
  const stage = new THREE.Group(); placeStage(stage, idx); stage.visible = false; root.add(stage);

  /* padella */
  const PAN_Y = 0.50;
  const pan = new THREE.Group(); pan.position.y = PAN_Y; stage.add(pan);
  const panMat = std(0x26221f, 0.5, { metalness: 0.4, side: THREE.DoubleSide });
  pan.add(new THREE.Mesh(new THREE.LatheGeometry([V2(0, 0), V2(0.2, 0), V2(0.22, 0.008), V2(0.262, 0.055), V2(0.252, 0.055), V2(0.214, 0.014), V2(0, 0.014)], 44), panMat));
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.018, 0.26, 12), panMat);
  handle.rotation.z = Math.PI / 2; handle.position.set(0.385, 0.05, 0); pan.add(handle);

  /* piatto ovale bianco */
  const plate = new THREE.Group(); plate.scale.set(1.3, 1, 1); stage.add(plate);
  plate.add(new THREE.Mesh(new THREE.LatheGeometry([V2(0, 0), V2(0.12, 0), V2(0.15, 0.008), V2(0.24, 0.04), V2(0.248, 0.045), V2(0.234, 0.047), V2(0.15, 0.017), V2(0, 0.013)], 44),
    std(0xf7f5f0, 0.3, { side: THREE.DoubleSide })));
  const juice = new THREE.Mesh(new THREE.CircleGeometry(0.17, 40), std(0xc98a2e, 0.25));
  juice.rotation.x = -Math.PI / 2; juice.position.y = 0.019; plate.add(juice);

  /* ingredienti: restano visibili, sono loro a formare il ragù */
  const items = (n, spread) => Array.from({ length: n }, () => {
    const pr = 0.165 * Math.sqrt(Math.random()), pa = rnd(0, 6.28);
    return { r: 0.19 * Math.sqrt(Math.random()), a: rnd(0, 6.28), y: rnd(0.022, 0.05), h: rnd(0.45, 0.62), d: rnd(0, spread),
             px: Math.cos(pa) * pr * 1.3, pz: Math.sin(pa) * pr, py: rnd(0.024, 0.05), dd: rnd(0, 1.9),
             rx: rnd(0, 6.28), ry: rnd(0, 6.28), rz: rnd(0, 6.28), s: rnd(0.75, 1.25) };
  });
  const meatGeo = new THREE.IcosahedronGeometry(0.014, 0); meatGeo.scale(1.3, 0.8, 1);
  const meatMat = std(0xa0302c, 0.85);
  const kinds = [
    { mesh: mkInst(stage, new THREE.BoxGeometry(0.03, 0.03, 0.03), std(0xf6eee4, 0.5), 12), arr: items(12, 0.6), start: T.lardo, fin: 0.3 },   // pistà ad grass
    { mesh: mkInst(stage, new THREE.TorusGeometry(0.02, 0.004, 5, 10, Math.PI), std(0xefe6c8, 0.5), 20), arr: items(20, 0.6), start: T.cip, fin: 0.8 },
    { mesh: mkInst(stage, new THREE.BoxGeometry(0.017, 0.017, 0.017), std(0xe8822a, 0.6), 26), arr: items(26, 0.6), start: T.car, fin: 1 },
    { mesh: mkInst(stage, new THREE.BoxGeometry(0.036, 0.007, 0.012), std(0xffffff, 0.45), 26), arr: items(26, 0.6), start: T.pep, fin: 1 },
    { mesh: mkInst(stage, meatGeo, meatMat, 110), arr: items(110, 1.0), start: T.meat, fin: 1 }
  ];
  const cR = new THREE.Color(0xc8281e), cY = new THREE.Color(0xe9b824);
  for (let i = 0; i < 26; i++) kinds[3].mesh.setColorAt(i, i % 2 ? cR : cY);      // peperoni rossi e gialli
  kinds[3].mesh.instanceColor.needsUpdate = true;
  const cRaw = new THREE.Color(0xa0302c), cCooked = new THREE.Color(0x5c3b28);

  const title = makeTitle(root, TITLE_4, ...titlePos(idx));

  function update(t, clock) {
    stage.visible = t >= 0;
    title.update(t, T.title, clock);
    if (t < 0) return;

    const ps = easeBack(seg(t, ...T.pan)) * (1 - ease(seg(t, ...T.panOut)));
    pan.visible = ps > 0.005; pan.scale.setScalar(Math.max(0.001, ps));
    plate.visible = t > T.plate[0];
    const pl = Math.max(0.001, easeBack(seg(t, ...T.plate)));
    plate.scale.set(1.3 * pl, pl, pl);
    juice.scale.setScalar(Math.max(0.001, ease(seg(t, T.pour + 0.4, T.pour + 2.6))));

    const m = seg(t, ...T.mix), swirl = ease(m) * 7;
    meatMat.color.copy(cRaw).lerp(cCooked, m);                // la carne rosola
    for (const k of kinds) {
      k.mesh.visible = t > k.start;
      if (!k.mesh.visible) continue;
      for (let i = 0; i < k.arr.length; i++) {
        const q = k.arr[i];
        if (t < k.start + q.d) { put(k.mesh, i, 0, 0, 0, 0); continue; }
        const p = clamp((t - k.start - q.d) / 0.7), ang = q.a + swirl;
        let x = Math.cos(ang) * q.r, z = Math.sin(ang) * q.r, y = PAN_Y + lerp(q.h, q.y, p * p);
        const v = clamp((t - T.pour - q.dd) / 0.8);
        if (v > 0) {                                           // dalla padella al piatto
          const e = ease(v);
          x = lerp(x, q.px, e); z = lerp(z, q.pz, e); y = lerp(y, q.py, e) + Math.sin(Math.PI * v) * 0.1;
        }
        put(k.mesh, i, x, y, z, q.s * lerp(1, k.fin, m), q.rx + (1 - p) * 4, q.ry + swirl, q.rz);
      }
      k.mesh.instanceMatrix.needsUpdate = true;
    }
  }

  update(-1, 0);
  return { update, title, tTitle: T.title, dur: T.title + 2 };
}

/* =====================  SCENA 1: PISAREI E FASÖ  ===================== */
function buildWorld(root, idx) {
  // tempi (secondi)
  const T = {
    flour: 0, water: [2.6, 5.0], mix: [4.6, 7.2], dough: [5.2, 7.2], shape: [7.2, 8.8],
    pot: [8.2, 9.2], boardOut: [9.0, 9.8], drop: 9.4, beans: 12.0,
    sauce: [14.5, 17.4], title: 17.8
  };

  // "palco" inclinato verso chi guarda, davanti alla pagina (larghezza pagina = 1)
  const stage = new THREE.Group();
  placeStage(stage, idx);
  root.add(stage);

  const instanced = (geo, mat, n) => mkInst(stage, geo, mat, n);

  /* ---- tagliere ---- */
  const BOARD_Y = 0.60, BOARD_TOP = BOARD_Y + 0.012;
  const boardMat = new THREE.MeshStandardMaterial({ color: 0xb98a55, roughness: 0.8, transparent: true });
  const board = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.024, 40), boardMat);
  board.position.y = BOARD_Y; stage.add(board);

  /* ---- farina ---- */
  const NF = 320;
  const flourMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true });
  const flour = instanced(new THREE.IcosahedronGeometry(0.011, 0), flourMat, NF);
  const fl = [];
  for (let i = 0; i < NF; i++) {
    const r = 0.17 * Math.sqrt(Math.random()), a = rnd(0, Math.PI * 2);
    fl.push({ d: rnd(0, 2.1), r, a, sx: rnd(-0.05, 0.05), sz: rnd(-0.05, 0.05), sy: rnd(1.25, 1.45),
              ey: BOARD_TOP + 0.10 * (1 - r / 0.17) * rnd(0.2, 1), s: rnd(0.6, 1.3) });
  }

  /* ---- acqua ---- */
  const NW = 70;
  const water = instanced(new THREE.SphereGeometry(0.012, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0x8fd4ff, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.85 }), NW);
  const wa = Array.from({ length: NW }, () => ({ ph: Math.random(), jx: rnd(-0.015, 0.015), jz: rnd(-0.015, 0.015), s: rnd(0.6, 1.2) }));

  /* ---- impasto ---- */
  const dough = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 16),
    new THREE.MeshStandardMaterial({ color: 0xe3cfa3, roughness: 0.85 }));
  dough.position.y = BOARD_TOP + 0.06; stage.add(dough);

  /* ---- pisarei: gnocchetti a conchiglia incavata ---- */
  const NP = 42;
  const sh = new THREE.Shape();
  sh.absarc(0, 0, 0.017, 0.75, Math.PI * 2 - 0.75, false);
  sh.absarc(0, 0, 0.008, Math.PI * 2 - 0.75, 0.75, true);
  const pisGeo = new THREE.ExtrudeGeometry(sh, { depth: 0.052, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 2, curveSegments: 10 });
  pisGeo.center();
  const pisMat = new THREE.MeshStandardMaterial({ color: 0xe6d3aa, roughness: 0.8 });
  const pis = instanced(pisGeo, pisMat, NP);
  const POT_R = 0.165;
  const potSpot = () => { const r = POT_R * Math.sqrt(Math.random()), a = rnd(0, Math.PI * 2);
                          return { x: Math.cos(a) * r, z: Math.sin(a) * r, y: rnd(0.045, 0.085) }; };
  const pi = [];
  for (let i = 0; i < NP; i++) {
    const r = 0.25 * Math.sqrt((i + 0.5) / NP), a = i * 2.39996;
    pi.push({ bx: Math.cos(a) * r, bz: Math.sin(a) * r, p: potSpot(), d: rnd(0, 1.6), dl: rnd(0, 0.6),
              rx: rnd(0, 6.28), ry: rnd(0, 6.28), rz: rnd(0, 6.28), j: rnd(-0.012, 0.012) });
  }

  /* ---- fagioli borlotti ---- */
  const NB = 30;
  const beanGeo = new THREE.SphereGeometry(0.021, 14, 10); beanGeo.scale(1.75, 1, 0.85);
  const beanMat = new THREE.MeshStandardMaterial({ map: beanTexture(), roughness: 0.45 });
  const beans = instanced(beanGeo, beanMat, NB);
  const be = Array.from({ length: NB }, () => ({ p: potSpot(), d: rnd(0, 1.8), h: rnd(1.0, 1.3),
              rx: rnd(0, 6.28), ry: rnd(0, 6.28), rz: rnd(0, 6.28), j: rnd(-0.012, 0.014) }));

  /* ---- pentolino di ceramica ---- */
  const pot = new THREE.Group(); stage.add(pot);
  const V = (x, y) => new THREE.Vector2(x, y);
  const outer = new THREE.Mesh(
    new THREE.LatheGeometry([V(0, 0), V(0.20, 0), V(0.225, 0.012), V(0.295, 0.185), V(0.302, 0.20)], 48),
    new THREE.MeshStandardMaterial({ color: 0x2a1710, roughness: 0.3, metalness: 0.15, side: THREE.DoubleSide }));
  const inner = new THREE.Mesh(
    new THREE.LatheGeometry([V(0.302, 0.20), V(0.292, 0.207), V(0.278, 0.20), V(0.205, 0.03), V(0, 0.03)], 48),
    new THREE.MeshStandardMaterial({ color: 0xa8502c, roughness: 0.45, side: THREE.DoubleSide }));
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.034, 0.24, 16),
    new THREE.MeshStandardMaterial({ color: 0x1c0f0a, roughness: 0.3, metalness: 0.15 }));
  handle.position.set(-0.385, 0.165, 0.03); handle.rotation.z = Math.PI / 2 - 0.22;
  pot.add(outer, inner, handle);

  /* ---- sugo ---- */
  const sauceMat = new THREE.MeshStandardMaterial({ color: 0xc8421c, roughness: 0.3 });
  const sauce = new THREE.Mesh(new THREE.CircleGeometry(1, 48), sauceMat);
  sauce.rotation.x = -Math.PI / 2; pot.add(sauce);
  const NS = 70;
  const drops = instanced(new THREE.SphereGeometry(0.017, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0xd23a17, roughness: 0.25 }), NS);
  const sd = Array.from({ length: NS }, () => ({ ph: Math.random(), jx: rnd(-0.02, 0.02), jz: rnd(-0.02, 0.02), s: rnd(0.6, 1.3) }));

  const steam = makeSteam(stage, 6, 0.2, 0.12);

  const title = makeTitle(root, TITLE_TEXT, ...titlePos(idx));

  const cWhite = new THREE.Color(0xffffff), cDough = new THREE.Color(0xe3cfa3);
  const cPis = new THREE.Color(0xe6d3aa), cPisS = new THREE.Color(0xe09a58);
  const cBeanS = new THREE.Color(0xffc9a0);

  function update(t, clock) {
    /* tagliere */
    const bo = seg(t, 0, 0.5) * (1 - seg(t, ...T.boardOut));
    board.visible = bo > 0.01; boardMat.opacity = bo;

    /* farina */
    const m = seg(t, ...T.mix), wet = seg(t, ...T.water);
    flour.visible = m < 1;
    if (flour.visible) {
      flourMat.color.copy(cWhite).lerp(cDough, wet);
      flourMat.opacity = 1 - m * m;
      for (let i = 0; i < NF; i++) {
        const f = fl[i], p = clamp((t - f.d) / 0.8);
        if (t < f.d) { put(flour, i, 0, 0, 0, 0); continue; }
        const k = p * p, ang = f.a + m * m * 11, rad = f.r * (1 - 0.8 * m);
        const ex = Math.cos(ang) * rad, ez = Math.sin(ang) * rad;
        put(flour, i, lerp(f.sx, ex, k), lerp(f.sy, f.ey, k), lerp(f.sz, ez, k), f.s * (1 - 0.6 * m), f.a, f.a * 2, 0);
      }
      flour.instanceMatrix.needsUpdate = true;
    }

    /* acqua */
    const wOn = t > T.water[0] && t < T.water[1];
    water.visible = wOn;
    if (wOn) {
      for (let i = 0; i < NW; i++) {
        const w = wa[i], raw = (t - T.water[0]) * 1.7 + w.ph, u = raw % 1;
        const endCut = (T.water[1] - t) * 1.7 < (1 - u) ? 0 : 1;
        put(water, i, lerp(0.30, 0.0, u) + w.jx, lerp(1.25, BOARD_TOP + 0.04, u * u), w.jz, raw < 1 ? 0 : w.s * endCut);
      }
      water.instanceMatrix.needsUpdate = true;
    }

    /* impasto */
    const ds = easeOut(seg(t, ...T.dough)) * (1 - ease(seg(t, T.shape[0], T.shape[1] - 0.2)));
    dough.visible = ds > 0.01;
    dough.scale.set(ds * (1 + 0.07 * Math.sin(t * 9)), ds * 0.62 * (1 + 0.07 * Math.cos(t * 9)), ds);
    dough.rotation.y = t * 3.5;

    /* pentolino */
    const ps = easeBack(seg(t, ...T.pot));
    pot.visible = t > T.pot[0]; pot.scale.setScalar(Math.max(0.001, ps));

    /* sugo */
    const sk = ease(seg(t, T.sauce[0] + 0.3, T.sauce[1]));
    const sy = lerp(0.032, 0.145, sk);
    sauce.visible = t > T.sauce[0] + 0.3;
    sauce.position.y = sy; sauce.scale.setScalar(0.203 + 0.073 * ((sy - 0.03) / 0.17) - 0.004);
    const sOn = t > T.sauce[0] && t < T.sauce[1] - 0.3;
    drops.visible = sOn;
    if (sOn) {
      for (let i = 0; i < NS; i++) {
        const d = sd[i], raw = (t - T.sauce[0]) * 1.5 + d.ph, u = raw % 1;
        const endCut = (T.sauce[1] - 0.3 - t) * 1.5 < (1 - u) ? 0 : 1;
        put(drops, i, lerp(-0.26, 0.0, u) + d.jx, lerp(1.05, sy, u * u), d.jz, raw < 1 ? 0 : d.s * endCut);
      }
      drops.instanceMatrix.needsUpdate = true;
    }

    /* pisarei */
    pis.visible = t > T.shape[0];
    if (pis.visible) {
      pisMat.color.copy(cPis).lerp(cPisS, sk);
      for (let i = 0; i < NP; i++) {
        const q = pi[i];
        const f = easeOut(clamp((t - T.shape[0] - q.dl) / 0.9));
        const p = clamp((t - T.drop - q.d) / 0.9), k = p * p;
        const by = BOARD_TOP + 0.016;
        let x = lerp(q.bx * f, q.p.x, p), z = lerp(q.bz * f, q.p.z, p);
        let y = lerp(by + (1 - f) * 0.05, q.p.y, k) + Math.sin(Math.PI * p) * 0.12;
        if (p >= 1) y = Math.max(q.p.y, sy - 0.006 + q.j);
        put(pis, i, x, y, z, f, q.rx + p * 5, q.ry, q.rz + p * 3);
      }
      pis.instanceMatrix.needsUpdate = true;
    }

    /* fagioli */
    beans.visible = t > T.beans;
    if (beans.visible) {
      beanMat.color.copy(cWhite).lerp(cBeanS, sk);
      for (let i = 0; i < NB; i++) {
        const b = be[i], p = clamp((t - T.beans - b.d) / 0.75);
        if (t < T.beans + b.d) { put(beans, i, 0, 0, 0, 0); continue; }
        let y = lerp(b.h, b.p.y + 0.02, p * p);
        if (p >= 1) y = Math.max(b.p.y + 0.02, sy - 0.004 + b.j);
        put(beans, i, b.p.x * lerp(1.4, 1, p), y, b.p.z * lerp(1.4, 1, p), 1, b.rx + p * 6, b.ry, b.rz + p * 4);
      }
      beans.instanceMatrix.needsUpdate = true;
    }

    steam(seg(t, T.sauce[1], T.sauce[1] + 1), clock);

    title.update(t, T.title, clock);
  }

  update(0, 0);
  return { update, title, tTitle: T.title, dur: T.title + 2, idle: c => steam(1, c) };
}
/* tutto è pronto: si parte dalla fotocamera */
boot();
</script>
